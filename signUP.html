<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login & Sign Up</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <link rel="stylesheet" href="/L&S.css" />
  </head>
  <body>
    <div class="container">
      <div class="form-container">
        <!-- Sign Up Form -->
        <form id="signupForm" class="form">
          <h2>Create Account</h2>
          <p>Join us today, it's free!</p>
          <label for="signupName" class="sr-only text-black">Full Name</label>
          <input type="text" placeholder="Samuel John" required />
          <label for="signupEmail" class="sr-only text-black">Email</label>
          <input type="email" placeholder="Johnsamuel55@gmail.com" required />
          <div class="password-field">
            <label for="signupPassword" class="sr-only text-black"
              >Password</label
            >
            <input
              type="password"
              placeholder="******"
              id="signupPassword"
              required />
          </div>
          <div class="password-field">
            <label for="confirmPassword" class="sr-only text-black"
              >Confirm Password</label
            >
            <input
              type="password"
              placeholder="******"
              id="confirmPassword"
              required />
          </div>
          <p class="terms">
            By signing up, you agree to our
            <a href="#">Terms & Privacy Policy</a>.
          </p>
          <button type="submit" class="btn signup">Sign Up</button>
          <div class="social">
            <p>or sign up with</p>
            <button class="google">
              <img src="/google.png" alt="Google" class="google-pic" />
            </button>
            <button class="facebook">Facebook</button>
          </div>
          <br />
          <a href="/LOGIN.HTML" id="loginForm" class="active"
            >Already have an account? Login here</a
          >
        </form>
      </div>
    </div>

    <script src="/l&s.js"></script>
  </body>
</html>
